# This makes Tmux use Alacritty’s default term. After setting this option,
# Tmux will try to apply true color to everything that runs inside.
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

# sets pressing escape trigger to 0 - this will prevent any delay when
# esc is used as keymap for escaping nvim terminal mode.
set -s escape-time 0

# bind a new prefix
# set -g prefix C-a
# unbind C-b
# bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on
set -g mode-keys vi

# copy modes
# use vi-style copy bindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
# linux only
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
unbind -T copy-mode-vi MouseDragEnd1Pane

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-yank'

set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-vim session

set -g @powerkit_plugins "git,hostname,datetime,weather,battery,cpu,disk,iops,memory,netspeed,wifi,vpn"

run '~/.tmux/plugins/tpm/tpm'
